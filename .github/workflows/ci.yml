name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # a throwaway Postgres just for the tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iam_service
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # fake secrets, only for this test run
    env:
      DB_PASSWORD: ci-password
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      KEYSTORE_PASSWORD: changeit123

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Make a throwaway keystore
        run: >
          keytool -genkeypair -alias iam -keyalg RSA -keysize 2048
          -storetype PKCS12 -keystore keystore.p12 -validity 30
          -storepass changeit123 -dname "CN=localhost"

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw test