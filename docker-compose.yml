services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: iam_service
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_user -d iam_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iam_service
      SPRING_DATA_REDIS_HOST: redis
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - ./keystore.p12:/app/keystore.p12:ro

  nginx:
    image: nginx:1.27
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  pgdata: